# ============================================================================
# dsh-gallery —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# 装好后只要 profile 的 `dsh.profile.bundles` 列出本包名即生效：
#
#   dsh plugin --profile web add link:<本目录>
#
# ⚠️ entry id（下面的 `gallery`）必须等于插件家目录名（$DSH_HOME/gallery），
#    配置与运行数据都放那儿，不写进插件包目录。
# ============================================================================

- insert:
    - id: gallery
      name: dsh-gallery
      config:
        enabled: true
